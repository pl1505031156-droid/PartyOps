name: 缺陷报告
description: 提交可重复、已脱敏的 PartyOps 功能或运行问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 感谢反馈。请勿上传真实人员、档案、凭据、备份或未脱敏日志。
  - type: input
    id: version
    attributes:
      label: PartyOps 版本
      placeholder: 例如 1.4.2
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 系统与架构
      options:
        - Windows 10 x64
        - Windows 11 x64
        - UOS V20 amd64
        - UOS V20 arm64
        - 源码开发环境
    validations:
      required: true
  - type: dropdown
    id: context
    attributes:
      label: 使用位置与账号
      options:
        - 主机管理员
        - 主机普通用户
        - 协同机管理员
        - 协同机普通用户
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请给出最小、稳定、已脱敏的操作步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与已脱敏日志
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除人员信息、业务内容、凭据、私钥、备份和内网敏感信息。
          required: true
