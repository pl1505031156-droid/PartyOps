[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "partyops"
version = "1.4.3rc3"
description = "党建智办：基层党建工作闭环协同系统"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.140.7",
  "starlette==1.3.1",
  "uvicorn==0.35.0",
  "SQLAlchemy==2.0.43",
  "alembic==1.16.5",
  "pydantic-settings==2.10.1",
  "argon2-cffi==25.1.0",
  "python-multipart==0.0.32",
  "sse-starlette==3.0.2",
  "python-docx==1.2.0",
  # 固定安全版本，避免 python-docx 的宽松传递依赖重新解析到
  # 受 PYSEC-2026-87 影响的 lxml 版本。
  "lxml==6.1.1",
  "PyMuPDF==1.26.0",
  "openpyxl==3.1.5",
  "Pillow==12.3.0",
  "pytesseract==0.3.13",
  "cryptography==50.0.0",
  "defusedxml==0.7.1",
  "httpx==0.28.1",
  "packaging==25.0",
  "numpy==2.2.6",
  "onnxruntime==1.22.1",
  "tokenizers==0.21.4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# 行覆盖率与分支覆盖率均由 scripts/verify-coverage.py 按 90% 分别校验；coverage.py
# 的单一 fail_under 会在 branch=true 时混合两个指标，无法表达发布门禁语义。
fail_under = 0
