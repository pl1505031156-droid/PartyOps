title = "PartyOps secret scanning"

[extend]
useDefault = true

[allowlist]
description = "只排除本机生成目录，以及明确属于业务幂等标识而非凭据的 recurrence_key 测试字段"
regexTarget = "line"
regexes = [
  '''["']recurrence_key["']\s*:''',
]
paths = [
  '''(^|/)backend/\.test-data/''',
  '''(^|/)frontend/node_modules/''',
  '''(^|/)frontend/dist/''',
  '''(^|/)website/node_modules/''',
  '''(^|/)website/dist/''',
  '''(^|/)\.venv/''',
  '''(^|/)\.build-windows/''',
  '''(^|/)\.build-linux/''',
  '''(^|/)\.build-uos/''',
  '''(^|/)artifacts/''',
  '''(^|/)build/''',
  '''(^|/)dist/''',
  '''(^|/)output/''',
  '''(^|/)vendor/''',
  # 官网源码按既定流程仅在本机维护；EdgeOne 密钥只允许进入 Git 已忽略的
  # *.local 环境文件。扫描规则仍覆盖所有可提交源码、普通 .env 和历史对象。
  '''(^|[\\/])website[\\/]\.env(?:\.[A-Za-z0-9_-]+)?\.local$''',
]
