title = "PartyOps secret scanning"

[extend]
useDefault = true

[allowlist]
description = "只排除本机生成目录，以及明确属于业务幂等标识而非凭据的 recurrence_key 测试字段"
regexTarget = "line"
regexes = [
  '''["']recurrence_key["']\s*:''',
]
paths = [
  '''(^|/)backend/\.test-data/''',
  '''(^|/)frontend/node_modules/''',
  '''(^|/)frontend/dist/''',
  '''(^|/)website/node_modules/''',
  '''(^|/)website/dist/''',
  '''(^|/)\.venv/''',
  '''(^|/)\.build-windows/''',
  '''(^|/)\.build-linux/''',
  '''(^|/)\.build-uos/''',
  '''(^|/)artifacts/''',
  '''(^|/)build/''',
  '''(^|/)dist/''',
  '''(^|/)output/''',
  '''(^|/)vendor/''',
  '''(^|[\\/])website[\\/]\.env\.local$''',
]
